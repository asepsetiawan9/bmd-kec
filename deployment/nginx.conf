# ==============================================================================
# Nginx Configuration for SIMUKTI BMD - Kecamatan Mekarmukti
# Domain: simukti.wiradashboard-ep.online
# Server Target: 31.97.187.71
# Path: /etc/nginx/sites-available/simukti.conf
# ==============================================================================

# Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=simukti_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=simukti_general:10m rate=30r/m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name simukti.wiradashboard-ep.online;
    return 301 https://$host$request_uri;
}

# HTTPS Server Block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name simukti.wiradashboard-ep.online;

    root /var/www/apps/simukti/public;
    index index.php index.html;

    # SSL Certificates (Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/simukti.wiradashboard-ep.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/simukti.wiradashboard-ep.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Maximum Upload Size (Dokumen & Foto Aset BMD)
    client_max_body_size 50M;

    charset utf-8;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static Assets Caching (Vite build output)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # FastCGI PHP 8.5-FPM via Unix Socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Block access to hidden files except certbot well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block access to database & backup files
    location ~* \.(sqlite|sqlite3|sql|db)$ {
        deny all;
        return 404;
    }

    location ^~ /backup {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/simukti_access.log;
    error_log  /var/log/nginx/simukti_error.log warn;
}
