# ==============================================================================
# Nginx Configuration for SIMUKTI BMD - Kecamatan Mekarmukti
# Domain: simukti.wiradashboard-ep.online
# Server: 31.97.187.71
# Path Target: /etc/nginx/sites-available/simukti.conf
# ==============================================================================

server {
    server_name simukti.wiradashboard-ep.online;
    root /var/www/apps/simukti/public;

    index index.php index.html;
    charset utf-8;
    client_max_body_size 50M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Static Assets Caching & Compression (Vite build assets)
    location ~* \.(ico|css|js|gif|jpeg|jpg|png|woff|woff2|ttf|svg|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # FastCGI PHP 8.5-FPM via Unix Socket
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 300;
    }

    # Block access to hidden files except certbot well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Block direct access to database & backup
    location ~* \.(sqlite|sqlite3|sql|db)$ {
        deny all;
        return 404;
    }

    location ^~ /backup {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/simukti_access.log;
    error_log  /var/log/nginx/simukti_error.log warn;

    listen 80;
    listen [::]:80;
}
